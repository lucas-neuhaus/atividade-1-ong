<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Instituto Vidas da Vila Aparecida: projetos comunitários, voluntariado e apoio às famílias da comunidade."
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Instituto Vidas da Vila Aparecida</title>
  </head>

  <body>
    <a class="pular-para-conteudo" href="#app">
      Pular para o conteúdo
    </a>

    <header>
      <div class="cabecalho-marca">
        <a
          href="#/home"
          class="link-logo"
          aria-label="Instituto Vidas da Vila Aparecida — página inicial"
        >
          <img
            src="../imagens/logo.png"
            alt=""
            width="320"
            height="168"
          />
        </a>

        <h1>Instituto Vidas da Vila Aparecida</h1>
      </div>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="menu-principal"
      >
        <span class="menu-toggle-icone" aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>

      <nav class="nav-principal" aria-label="Navegação principal">
        <ul id="menu-principal" class="menu-principal">
          <li>
            <a href="#/home" data-route="/home">Home</a>
          </li>

          <li class="menu-item-com-submenu">
            <a href="#/projetos" data-route="/projetos">Projetos</a>

            <ul class="submenu">
              <li>
                <a href="#/projetos">Projetos ativos</a>
              </li>
              <li>
                <a href="#/projetos/voluntariado">Voluntariado</a>
              </li>
              <li>
                <a href="#/projetos/doacao">Como doar</a>
              </li>
            </ul>
          </li>

          <li>
            <a href="#/cadastro" data-route="/cadastro">Cadastro</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="rodape-pagina">
      <p>
        &copy; 2026 Instituto Vidas da Vila Aparecida. Todos os direitos
        reservados.
      </p>
    </footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
